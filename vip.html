<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VIP Sounds Manager</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f9; padding: 20px; color: #1f1f1f; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    input, select, button { padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; font-size: 14px; }
    button { background: #0b57d0; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 15px; transition: 0.2s; }
    button:hover { background: #0842a0; }

    .upload-btn { background: #188038; margin-bottom: 20px; }
    .upload-btn:hover { background: #13652c; }

    .vip-item { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; margin-top: 10px; padding: 12px; border-radius: 6px; border: 1px solid #e0e0e0; }
    .vip-item .name { font-weight: bold; word-break: break-word; }
    .vip-item .sound { color: #555; font-size: 12px; }
    .delete-btn { background: #d93025; width: auto; margin: 0 0 0 12px; padding: 6px 12px; font-size: 12px; flex: none; }
    .delete-btn:hover { background: #a50e0e; }
    .empty { color: #5f6368; font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>

  <button type="button" class="upload-btn" id="uploadBtn">⬆️ Upload New .mp3 file</button>

  <div class="card">
    <h2 style="margin-top:0;">Add a VIP Rule</h2>
    <label for="name">Coworker or Chat Name:</label>
    <input type="text" id="name" placeholder="e.g., Boss Man, Jimmy, Team Alpha">

    <label for="soundSelect" style="display:block; margin-top:15px;">Select Sound File:</label>
    <select id="soundSelect"></select>

    <button type="button" id="addBtn">Save VIP Assignment</button>
  </div>

  <h3 style="margin-top:25px;">Current VIPs</h3>
  <div id="vipList"></div>

  <script>
    const { ipcRenderer } = require('electron');
    let currentVips = {};

    async function init() {
      const data = await ipcRenderer.invoke('get-vips');
      currentVips = data.vips || {};

      const select = document.getElementById('soundSelect');
      select.innerHTML = '';
      if (!data.sounds || data.sounds.length === 0) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'No .mp3 files uploaded yet!';
        select.appendChild(opt);
      } else {
        data.sounds.forEach((sound) => {
          const opt = document.createElement('option');
          opt.value = sound;
          opt.textContent = sound;
          select.appendChild(opt);
        });
      }
      renderList();
    }

    async function uploadSound() {
      const success = await ipcRenderer.invoke('upload-sound');
      if (success) init(); // refresh the dropdown so the new sound appears
    }

    // Names come from user input and are written straight back out here, so
    // everything below builds nodes and sets textContent. The previous version
    // interpolated them into innerHTML and into an inline onclick attribute,
    // where an apostrophe in a name broke the button outright.
    function renderList() {
      const list = document.getElementById('vipList');
      list.innerHTML = '';

      const entries = Object.entries(currentVips);
      if (entries.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = 'No VIPs yet. Add one above to give someone their own alert sound.';
        list.appendChild(empty);
        return;
      }

      for (const [name, sound] of entries) {
        const row = document.createElement('div');
        row.className = 'vip-item';

        const info = document.createElement('div');
        const nameEl = document.createElement('div');
        nameEl.className = 'name';
        nameEl.textContent = name;
        const soundEl = document.createElement('div');
        soundEl.className = 'sound';
        soundEl.textContent = sound;
        info.appendChild(nameEl);
        info.appendChild(soundEl);

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'delete-btn';
        remove.textContent = 'Remove';
        remove.addEventListener('click', () => deleteVip(name));

        row.appendChild(info);
        row.appendChild(remove);
        list.appendChild(row);
      }
    }

    function addVip() {
      const name = document.getElementById('name').value.trim();
      const sound = document.getElementById('soundSelect').value;
      if (!name || !sound) {
        alert('Please enter a name and make sure a sound is selected!');
        return;
      }

      currentVips[name] = sound;
      ipcRenderer.send('save-vips', currentVips);
      document.getElementById('name').value = '';
      renderList();
    }

    function deleteVip(name) {
      delete currentVips[name];
      ipcRenderer.send('save-vips', currentVips);
      renderList();
    }

    document.getElementById('uploadBtn').addEventListener('click', uploadSound);
    document.getElementById('addBtn').addEventListener('click', addVip);
    document.getElementById('name').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addVip();
    });

    init();
  </script>
</body>
</html>
