name: Release

# Pushing a version tag builds the installer and uploads it to a DRAFT GitHub
# release. Nothing reaches users until that draft is published by hand.
#
#   npm.cmd version patch      # bumps package.json, commits, tags
#   git push --follow-tags     # pushes the commit and the tag -> triggers this
#
# No personal access token is involved: GITHUB_TOKEN is minted per run by
# Actions and is scoped to this repository alone.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Two builds of the same version racing each other is how the 1.4.1 release
# ended up with a mismatched manifest and no blockmap. Queue them instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # package.json is the source of truth. On a tag push the tag must agree
      # with it; on a manual run there is no tag to compare, so the expected
      # release tag is derived from the version instead.
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          "version=$pkg" >> $env:GITHUB_OUTPUT
          "tag=v$pkg"    >> $env:GITHUB_OUTPUT
          Write-Host "package.json version: $pkg"

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $pkg = "${{ steps.version.outputs.version }}"
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          if ($tag -ne $pkg) {
            Write-Error "Tag $tag does not match package.json version $pkg. Refusing to publish a mislabelled release."
            exit 1
          }
          Write-Host "Tag and package.json agree on $pkg"

      - name: Build and publish draft release
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm every asset uploaded
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The updater needs all three. A missing blockmap silently downgrades
          # every client to full ~100 MB downloads instead of differential ones.
          $tag = "${{ steps.version.outputs.tag }}"
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $url = "https://api.github.com/repos/${{ github.repository }}/releases"
          $rel = Invoke-RestMethod $url -Headers $h |
                 Where-Object { $_.tag_name -eq $tag } |
                 Select-Object -First 1
          if (-not $rel) { Write-Error "No release found for tag $tag"; exit 1 }

          $assets = @($rel.assets)
          Write-Host ("Assets: " + (($assets | ForEach-Object {
            "$($_.name) [$($_.state), $([math]::Round($_.size / 1MB, 1)) MB]"
          }) -join ', '))

          # An asset whose upload failed part-way still comes back from the API
          # with its name, so checking names alone proves nothing -- it has to
          # have reached state 'uploaded'. Anything else shows as a broken or
          # absent download on the release page.
          $usable = @($assets | Where-Object { $_.state -eq 'uploaded' })
          $stalled = @($assets | Where-Object { $_.state -ne 'uploaded' })
          if ($stalled) {
            Write-Error ("Assets stuck mid-upload: " + (($stalled | ForEach-Object {
              "$($_.name) [$($_.state)]"
            }) -join ', '))
            exit 1
          }

          $names = @($usable | ForEach-Object { $_.name })
          $missing = @('.exe', '.exe.blockmap', 'latest.yml') | Where-Object {
            $suffix = $_
            -not ($names | Where-Object { $_.EndsWith($suffix) })
          }
          if ($missing) { Write-Error "Missing from the release: $($missing -join ', ')"; exit 1 }

          # A truncated installer would still say 'uploaded'.
          $exe = $usable | Where-Object { $_.name.EndsWith('.exe') } | Select-Object -First 1
          if ($exe.size -lt 50MB) {
            Write-Error "Installer is only $([math]::Round($exe.size / 1MB, 1)) MB -- expected ~95 MB. Upload was truncated."
            exit 1
          }

          Write-Host "All required assets uploaded. Publish the draft when ready:"
          Write-Host $rel.html_url

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ steps.version.outputs.tag }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          retention-days: 14
